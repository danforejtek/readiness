name: ReadinessApp
options:
  bundleIdPrefix: com.danforejtek
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HRVCore:
    path: ../Packages/HRVCore
targets:
  ReadinessApp:
    type: application
    platform: iOS
    sources:
      - path: ReadinessApp
        excludes:
          - "Resources/**"
      - path: ReadinessApp/Resources/Fixtures
        buildPhase: resources
    dependencies:
      - package: HRVCore
    entitlements:
      path: ReadinessApp/ReadinessApp.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danforejtek.readiness
        PRODUCT_NAME: Readiness
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Readiness
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Readiness connects to your heart-rate band to measure heart rate variability."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Readiness saves your morning heart rate variability and resting heart rate to Apple Health."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Readiness does not read Health data; this permission is only requested together with saving."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 96XQ29U7ZA
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1
