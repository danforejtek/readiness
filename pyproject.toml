[project]
name = "hrmon"
version = "0.1.0"
description = "Use a standard Bluetooth LE heart-rate band (Elonga / COOSPO armband) as a live HR + HRV monitor on macOS"
requires-python = ">=3.10"
dependencies = ["bleak>=0.22", "rich>=13"]

[project.scripts]
hrmon = "hrmon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hrmon"]
